<div class="container">
  <header class="header-cart">
    <h1>Cursos disponibles</h1>
    <div class="cart-info">
      <span>Inscritos: {{ cursosInscritos.length }}</span>
      <span>Total a pagar: Bs {{ totalAPagar }}</span>
    </div>
  </header>

  <main class="grid-cursos">
    @for (curso of cursos; track curso.id) {
      <app-curso-card
        [curso]="curso"
        [inscrito]="estaInscrito(curso.id)"
        (inscribirse)="inscribir($event)"></app-curso-card>
    }
  </main>
</div>
