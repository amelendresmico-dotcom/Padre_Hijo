<div class="container">
  <header class="header-cart">
    <h1>Tienda</h1>
    <div class="cart-info">
      <span> Productos: {{ cantidad }}</span>
      <span> Total: Bs{{ total }}</span>
    </div>
  </header>

  <main class="grid-productos">
    @for (prod of productos; track prod.id){
      <app-producto-card
      [producto]="prod"
      (agregar)="agregarAlCarrito($event)"></app-producto-card>
    }
  </main>
</div>
